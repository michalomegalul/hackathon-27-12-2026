map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    absolute_redirect off;

    # Resolve app/api through Docker's DNS on every request (cached 10 s). A plain
    # proxy_pass http://app:8501 is resolved once at startup, so when a deploy recreates
    # app/api and they get new IPs, nginx keeps the old ones and returns 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_up http://api:8000;
    set $app_up http://app:8501;

    # Static test page stays where it was.
    location /test {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }

    # The React site (clients/web), built into the image by clients/web/Dockerfile.
    # Unknown paths under /web/ fall back to index.html (client-side routes like /web/jobs/<id>).
    location = /web {
        return 301 /web/;
    }
    location /web/ {
        root /usr/share/nginx;
        try_files $uri /web/index.html;
    }
    location /web/assets/ {
        root /usr/share/nginx;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The HTTP API (docs/API.md) and its Swagger docs. Jobs are polled, so no request is
    # long; the ZIP download is the slowest (built once, then cached).
    location ^~ /v1/ {
        proxy_pass $api_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 2m;
    }
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass $api_up;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Everything else is the Streamlit app. It talks over a websocket, and LLM
    # jobs keep it open for minutes, so no buffering and long timeouts.
    location / {
        proxy_pass $app_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
