server {
    listen 80;
    absolute_redirect off;

    # Resolve api through Docker's DNS on every request (cached 10 s). A plain
    # proxy_pass http://api:8000 is resolved once at startup, so when a deploy recreates
    # api and it gets a new IP, nginx keeps the old one and returns 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_up http://api:8000;

    # The React site (clients/web), built into the image by clients/web/Dockerfile.
    # Unknown paths fall back to index.html (client-side routes like /run/<id>).
    root /usr/share/nginx/web;
    location / {
        try_files $uri /index.html;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The site used to live under /web/: old links (QR codes, shared runs) keep working.
    # The query string is kept; the #fragment (e.g. #token=...) stays in the browser.
    location = /web {
        return 301 /;
    }
    location ^~ /web/ {
        rewrite ^/web/(.*)$ /$1 permanent;
    }

    # The HTTP API (docs/API.md) and its Swagger docs. Jobs are polled, so no request is
    # long; the ZIP download is the slowest (built once, then cached).
    location ^~ /v1/ {
        proxy_pass $api_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 2m;
    }
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass $api_up;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}
