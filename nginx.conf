map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    absolute_redirect off;

    # Static test page stays where it was.
    location /test {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }

    # The HTTP API (docs/API.md) and its Swagger docs. Jobs are polled, so no request is
    # long; the ZIP download is the slowest (built once, then cached).
    location ^~ /v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 2m;
    }
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Everything else is the Streamlit app. It talks over a websocket, and LLM
    # jobs keep it open for minutes, so no buffering and long timeouts.
    location / {
        proxy_pass http://app:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
