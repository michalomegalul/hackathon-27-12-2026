title: Pekárna Kvásek
company: >
  Pekárna Kvásek s.r.o. je řemeslná pekárna se 3 prodejnami v Olomouci, Prostějově a Přerově.
  Prodává chleba, sladké pečivo a dorty, objednávky dortů bere i přes e-shop s osobním odběrem.
  Má asi 6 000 pravidelných zákazníků: rodiny, kancelářské firmy na snídaně a studenty.
  Mouku bere z mlýna v Kroměříži, máslo a smetanu od mlékárny z Hané.
story: >
  Data od dubna 2025 do konce roku 2026. V červnu 2026 mlýn dodá vadnou mouku, chleba je dva týdny
  horší a hodnocení spadne. Rodiny v Prostějově pak během dalšího měsíce začnou odcházet ke konkurenci.
  V září 2026 zdražíme dorty o 12 %, firmy objednávají méně. Na Vánoce 2025 je běžná sezónní špička,
  to není událost.
