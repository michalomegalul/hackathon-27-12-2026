title: Bylinka Box
company: >
  Bylinka Box s.r.o. posílá měsíční předplatné přírodní kosmetiky po celé ČR, prodává přes e-shop
  a mobilní aplikaci. Má zhruba 9 000 předplatitelek a předplatitelů, hlavně v Praze, Brně a Ostravě,
  zbytek po republice. Segmenty: maminky, studentky a dárkoví kupující. Krémy a mýdla vyrábí
  dodavatel z Valašska, obaly jsou z Polska.
story: >
  Data za dva roky od ledna 2025. V březnu 2026 spustíme influencerskou kampaň na studentky,
  přijde výrazně víc nových zákaznic, ale po dvou měsících jich čtvrtina odejde. V červenci 2026
  se kvůli výpadku polského dodavatele obalů zpozdí rozesílka o týden a přibude stížností.
  Dárkoví kupující nakupují hlavně před Vánoci.
