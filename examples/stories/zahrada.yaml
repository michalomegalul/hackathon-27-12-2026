title: Zahrada Online
company: >
  Zahrada Online s.r.o. je e-shop se zahradními potřebami: semínka, cibuloviny, nářadí, hnojiva a
  zahradní nábytek. Doručuje po celé republice, nejvíc do Prahy, Plzně, Karlových Varů, Brna a Pardubic.
  Asi 12 000 zákazníků: chalupáři, zahrádkáři a zahradní architekti. Cibuloviny a semínka dováží
  z Nizozemska, nářadí a nábytek od českého dodavatele.
story: >
  Data od ledna 2025 na 22 měsíců, sezóna je na jaře. V březnu 2026 se kvůli stávce v rotterdamském
  přístavu zdrží dodávky cibulovin z Nizozemska na čtyřnásobek, zboží chybí a přibude stížností.
  Od června 2026 přejdeme v Plzni a Karlových Varech na levnějšího kurýra. Balíky chodí o dva dny
  později, hodnocení klesá a zákazníci, kterým balík přišel pozdě, odcházejí.
