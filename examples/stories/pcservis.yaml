title: PC Servis Hájek
company: >
  PC Servis Hájek s.r.o. prodává počítače, komponenty a příslušenství přes e-shop a telefonicky,
  s kamennou prodejnou v Pardubicích. Asi 10 000 zákazníků: hráči, firmy a domácnosti. Komponenty
  od tchajwanského distributora, příslušenství od českého velkoobchodu.
story: >
  Data od ledna 2025 do konce října 2026. V březnu 2026 spadne e-shop na tři dny kvůli výpadku
  serveru. V červnu 2026 onemocní polovina zákaznické podpory a tikety se řeší týden. V srpnu 2026
  se video s naší herní sestavou stane virálním a na pár dní přijde obrovská návštěvnost.
  Od září 2026 zlevníme grafické karty o 8 %.
