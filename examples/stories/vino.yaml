title: Vinotéka U Sudu
company: >
  Vinotéka U Sudu s.r.o. prodává moravská a zahraniční vína přes e-shop a ve dvou vinotékách
  v Brně a Mikulově. Asi 8 000 zákazníků: milovníci vína, restaurace a firmy na dárky. Moravská vína
  bere od vinařů z Pálavy, zahraniční od dovozce z Rakouska.
story: >
  Data od ledna 2025 do konce října 2026. Na začátku září 2026 začnou restaurace odcházet k levnějšímu
  velkoobchodu, během měsíce jich odejde pětina. 15. října 2026 spustíme kampaň na Svatomartinské víno
  pro firmy. Vinobraní v září je běžná sezóna.
