title: Kafe Kolektiv
company: >
  Kafe Kolektiv s.r.o. provozuje síť 6 kaváren v Praze, Brně a Olomouci a prodává kávu a dezerty také
  přes mobilní aplikaci s výdejem na pobočce. Asi 18 000 stálých zákazníků: studenti, lidé z kanceláří
  a turisté. Kávu bere od pražírny z Brna, mléko od mlékárny z Vysočiny, dezerty peče vlastní cukrárna.
story: >
  Data od ledna 2025 do konce října 2026. V dubnu 2026 dodá mlékárna na tři týdny mléko horší kvality,
  káva chutná jinak a hodnocení i prodeje kávy klesnou. V září 2026 otevře v Brně velký řetězec
  konkurenční kavárnu hned vedle naší a brněnské kavárny ztratí asi pětinu objednávek.
  Letní útlum je normální.
