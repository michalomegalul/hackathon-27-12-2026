title: Velo Brno
company: >
  Velo Brno a.s. prodává a servisuje jízdní kola. Má prodejny v Brně, Zlíně a Jihlavě a e-shop.
  Asi 15 000 zákazníků: rekreační cyklisté, závodníci a dojíždějící do práce. Kola dováží
  od německého distributora, díly od tchajwanského výrobce, doplňky od českého velkoobchodu.
story: >
  Data od ledna 2025 na 22 měsíců. Hlavní sezóna je jaro a léto. V květnu 2026 se kvůli
  problémům v přístavu prodlouží dodávky dílů z Tchaj-wanu na trojnásobek a servis nestíhá.
  Závodníci ve Zlíně potom do šesti týdnů z velké části odejdou. V srpnu 2026 otevře v Jihlavě
  velký sportovní řetězec a prodejna tam ztratí asi čtvrtinu tržeb.
