title: FitPoint
company: >
  FitPoint s.r.o. provozuje 4 posilovny (Praha, Brno, Liberec, Ústí nad Labem) a e-shop s doplňky stravy.
  Zákazníci mají měsíční členství jako předplatné a k tomu nakupují proteiny a doplňky na recepci
  nebo v e-shopu. Asi 14 000 členů: studenti, pracující a senioři. Doplňky bere od polského výrobce,
  oblečení od českého dodavatele.
story: >
  Data od ledna 2025 na 21 měsíců. 1. ledna 2026 zdražíme členství i doplňky o 20 %. Studenti
  v Liberci pak během dvou měsíců ve velkém ruší předplatné. V září 2026 poběží kampaň na nové
  členy v Brně. Lednový nával předsevzetí je běžná sezóna.
