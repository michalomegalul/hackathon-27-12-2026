title: Lékárna Heřmánek
company: >
  Lékárna Heřmánek s.r.o. je online lékárna s e-shopem a mobilní aplikací, doručuje po celé ČR.
  Prodává volně prodejné léky, vitamíny, kosmetiku a zdravotní pomůcky. Má asi 20 000 zákazníků:
  rodiny s dětmi, senioři a sportovci. Nejvíc zákazníků je z Prahy, Brna, Ostravy, Plzně a Liberce.
  Léky bere od velkodistributora Phoenix, vitamíny od českého výrobce, kosmetiku od dodavatele z Německa.
story: >
  Data od ledna 2025 do konce října 2026. 1. února 2026 zdražíme vitamíny o 10 %, jejich prodeje
  mírně klesnou. V květnu 2026 spustíme v aplikaci kampaň pro seniory se slevou na zdravotní pomůcky,
  přijde víc nových seniorů a ti stávající nakupují častěji. Chřipková sezóna v zimě je normální, ne událost.
