title: Hračkárna Kostička
company: >
  Hračkárna Kostička a.s. má 5 kamenných prodejen (Praha, Brno, Ostrava, Hradec Králové, České Budějovice)
  a e-shop. Prodává stavebnice, deskové hry, plyšáky a outdoorové hračky. Asi 25 000 zákazníků: rodiny,
  prarodiče a sběratelé stavebnic. Stavebnice dováží od dánského dodavatele, hry od německého
  vydavatele, ostatní od českého velkoobchodu.
story: >
  Data od března 2025 do konce září 2026. V polovině listopadu 2025 se stavebnice vyprodají, dánský
  dodavatel nestíhá a tři týdny nejsou skladem. Zákazníci si stěžují. Sběratelé stavebnic potom během
  šesti týdnů částečně odejdou jinam. Vánoce a Black Friday jsou běžná sezóna.
