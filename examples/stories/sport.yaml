title: SportMax
company: >
  SportMax s.r.o. prodává sportovní potřeby: obuv, oblečení, vybavení a doplňky. Má e-shop
  a dvě prodejny, v Praze a v Brně. Má asi 20 000 zákazníků: rekreační sportovce,
  závodní sportovce a rodiny s dětmi.
story: >
  Data od ledna 2025 do konce roku 2026. Od dubna 2026 klesly tržby o 5 %.
  V září 2026 otevřel v Brně velký konkurent a prodejna v Brně ztratila asi pětinu tržeb.
  Na Vánoce 2025 je běžná sezónní špička, to není událost.
