title: Papírnictví Tužka
company: >
  Papírnictví Tužka s.r.o. má 3 prodejny v Hradci Králové, Pardubicích a Chrudimi a e-shop. Prodává
  sešity, psací potřeby, výtvarné potřeby a kancelářský papír. Asi 7 000 zákazníků: školy, rodiny
  se školáky a malé firmy. Zboží bere od českého velkoobchodu a od německého výrobce psacích potřeb.
story: >
  Data od ledna 2025 na 18 měsíců. Nic zvláštního se neděje: na začátku září je nákup do školy
  a před Vánoci víc dárků, to je běžná sezóna. Žádné změny cen, kampaně ani výpadky.
